<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevFlow Tools</title>
    <style>
      * { box-sizing: border-box; }
      :root { --surface:#1d2028; --text:#e8ebf2; --muted:#a5adbc; --border:#343946; --hover:#2b3442; --accent:#5c9af4; }
      body.theme-light { --surface:#fff; --text:#202938; --muted:#697487; --border:#d9e0e9; --hover:#edf3fb; --accent:#276fe0; }
      html, body { width:100%; height:100%; margin:0; overflow:hidden; }
      body { padding:7px; background:transparent; color:var(--text); font:13px Inter,"Segoe UI",system-ui,sans-serif; }
      .menu { height:100%; padding:8px; display:flex; flex-direction:column; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 35px #0005; animation:slide-down 180ms cubic-bezier(.2,.8,.2,1); }
      button { width:100%; min-height:38px; padding:0 12px; display:flex; align-items:center; gap:12px; border:0; border-radius:9px; background:transparent; color:var(--muted); text-align:left; font:inherit; cursor:pointer; transition:background .14s ease,color .14s ease; }
      button:hover,button:focus-visible { outline:none; background:var(--hover); color:var(--text); }
      button.active { background:var(--hover); color:var(--text); box-shadow:inset 2px 0 var(--accent); }
      .icon { width:22px; color:var(--accent); text-align:center; font-size:11px; font-weight:700; letter-spacing:-.03em; }
      .separator { height:1px; margin:4px 8px; background:var(--border); }
      @keyframes slide-down { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    </style>
  </head>
  <body>
    <div class="menu" role="menu" aria-label="DevFlow tools">
      <button data-tool="private-tab"><span class="icon">PR</span>New Private Tab</button>
      <div class="separator"></div>
      <button data-tool=""><span class="icon">HM</span>Home</button>
      <button data-tool="bookmarks"><span class="icon">BK</span>Bookmarks</button>
      <button data-tool="history"><span class="icon">HI</span>History</button>
      <button data-tool="api"><span class="icon">API</span>API Testing</button>
      <button data-tool="developer"><span class="icon">JS</span>Developer Console</button>
      <button data-tool="network"><span class="icon">NW</span>Network Monitor</button>
      <button data-tool="downloads"><span class="icon">DL</span>Downloads</button>
      <button data-tool="responsive"><span class="icon">RS</span>Responsive Mode</button>
      <button data-tool="inspector"><span class="icon">DOM</span>Element Inspector</button>
      <button data-tool="permissions"><span class="icon">PER</span>Website Permissions</button>
      <button data-tool="settings"><span class="icon">ST</span>Settings</button>
    </div>
    <script>
      window.toolsMenuAPI.getTheme().then(theme => document.body.classList.toggle("theme-light", theme === "light"));
      window.toolsMenuAPI.onTheme(theme => document.body.classList.toggle("theme-light", theme === "light"));
      window.toolsMenuAPI.onActive(tool => document.querySelectorAll("[data-tool]").forEach(button => button.classList.toggle("active", button.dataset.tool === tool)));
      let menuWasEntered = false;
      document.querySelectorAll("[data-tool]").forEach(button => button.addEventListener("click", () => window.toolsMenuAPI.selectTool(button.dataset.tool)));
      document.addEventListener("mouseenter", () => { menuWasEntered = true; });
      document.addEventListener("mouseleave", () => { if (menuWasEntered) window.toolsMenuAPI.closeMenu(); });
      document.addEventListener("keydown", event => { if (event.key === "Escape") window.close(); });
    </script>
  </body>
</html>
