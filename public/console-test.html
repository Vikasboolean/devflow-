
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevFlow Console Test</title>
</head>
<body>
  <h1>DevFlow Console Test</h1>
  <p>Testing browser console messages.</p>

  <script>
    console.log("DevFlow: Console log is working!");
    console.info("DevFlow: Info message received.");
    console.warn("DevFlow: Warning message received.");
    console.error("DevFlow: Error message received.");

    const testObject = {
      browser: "DevFlow",
      version: "1.0",
      status: "Testing"
    };

    console.log("Test object:", testObject);
  </script>
</body>
</html>
